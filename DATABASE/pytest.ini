[pytest]
# Run from DATABASE/:  python -m pytest -q tests/unit
# Integration tests are skipped unless ASTRO_TEST_DB_HOST is set (see tests/integration/test_schema_and_load.py).
testpaths = tests
addopts = -ra --strict-markers -p no:cacheprovider
xfail_strict = true
markers =
    integration: needs a throwaway MariaDB (ASTRO_TEST_DB_HOST)
    slow: runs a full synthetic generator (a few seconds)
